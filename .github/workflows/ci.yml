name: HeecoMou CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway-lint:
    name: Go Gateway Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./cmd/gateway/
      - run: go test ./...

  backend-check:
    name: Java Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - run: mvn test -B

  asr-lint:
    name: Python ASR Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asr-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - run: ./gradlew assembleDebug
        continue-on-error: true

  desktop-test:
    name: Desktop Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon -Djava.awt.headless=true

  e2e-test:
    name: E2E Integration Test
    runs-on: ubuntu-latest
    needs: [gateway-lint, backend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start infrastructure (MySQL + Redis)
        run: |
          docker compose up -d
          echo "Waiting for MySQL health check..."
          for i in $(seq 1 30); do
            if docker compose exec mysql mysqladmin ping -h localhost -u root -pheecomou123 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "  attempt $i/30..."
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 15); do
            if docker compose exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            echo "  attempt $i/15..."
            sleep 1
          done

      - name: Start Backend
        run: |
          cd backend-java
          mvn spring-boot:run -Dspring-boot.run.profiles=dev -B &
          echo "Waiting for Backend :8081..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:8081/api/v1/health | grep -qi UP; then
              echo "Backend is ready"
              break
            fi
            echo "  attempt $i/60..."
            sleep 2
          done

      - name: Start Gateway
        run: |
          cd gateway-go
          go build -o gateway ./cmd/gateway/
          ./gateway &
          echo "Waiting for Gateway :8080..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health | grep -qi UP; then
              echo "Gateway is ready"
              break
            fi
            echo "  attempt $i/30..."
            sleep 1
          done

      - name: Run E2E tests
        run: |
          chmod +x scripts/e2e-test.sh
          bash scripts/e2e-test.sh

      - name: Cleanup
        if: always()
        run: |
          kill $(lsof -t -i:8081) 2>/dev/null || true
          kill $(lsof -t -i:8080) 2>/dev/null || true
          docker compose down -v 2>/dev/null || true