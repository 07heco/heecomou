name: HeecoMou CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway-lint:
    name: Go Gateway Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./cmd/gateway/
      - run: go test ./...

  backend-check:
    name: Java Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - run: mvn test -B

  asr-lint:
    name: Python ASR Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asr-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - run: ./gradlew assembleDebug
        continue-on-error: true

  desktop-test:
    name: Desktop Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - run: |
          chmod +x client-android/gradlew
          cd client-android && ./gradlew -p ../client-desktop test --no-daemon -Dkotlin.compiler.execution.strategy=in-process